[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryorole"
version = "2.0.0a1"
description = "Policy-driven cryo-EM relative-orientation analysis platform."
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
  "matplotlib",
  "numpy",
  "pandas",
  "Pillow",
  "scipy",
]

[project.scripts]
cryorole = "cryorole.cli.main:main"

[tool.setuptools.packages.find]
include = ["cryorole*"]

[tool.setuptools.package-data]
"cryorole.interactive" = ["assets/*"]

[project.optional-dependencies]
test = [
  "pytest",
  "ruff",
]

[tool.ruff]
target-version = "py39"
line-length = 120
exclude = [
  ".codex_tmp",
  ".idea",
  "build",
  "cryorole.egg-info",
  "Github",
  "old_files",
  "cryorole2_landscape_projection.py",
  "cryorole2_plot_1d_updated.py",
  "cryorole_chimerax_viewer.py",
  "main.py",
  "star_align_exclude.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/*.py" = ["E402"]
"tests/**/*.py" = ["F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "chimerax: requires a local UCSF ChimeraX installation and prepared asymmetric test session",
  "ffmpeg: requires local FFmpeg and FFprobe executables",
]
