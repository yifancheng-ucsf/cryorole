name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check cryorole tests benchmarks scripts

  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Python (requires-python = ">=3.9") and a current one on Linux,
          # plus macOS (Apple silicon), the main desktop platform.
          # ubuntu-latest (Ubuntu 26.04) has no Python 3.9 build; 24.04 still does.
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.12"
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install cryoROLE with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
      - name: Check the installed command
        run: |
          cryorole --version
          cryorole run --help > /dev/null
      # Data-derived fixtures are not published, so the tests that need them
      # report "skipped" here (see tests/conftest.py); ChimeraX/FFmpeg
      # integration tests also skip unless those programs are configured.
      - name: Run tests
        run: python -m pytest tests -q -rs

  gui:
    name: GUI tests (ubuntu-latest, Python ${{ matrix.python-version }}, headless)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Qt 6 needs these system libraries even for the offscreen platform.
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxcb-cursor0 libfontconfig1 libdbus-1-3
      - name: Install cryoROLE with the GUI extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[gui-test]"
      - name: Check the installed command
        run: cryorole gui --help > /dev/null
      - name: Run GUI and architecture tests
        run: |
          python -m pytest tests/gui tests/architecture -q -rs
          python -m pytest tests/gui tests/architecture -q -rs
